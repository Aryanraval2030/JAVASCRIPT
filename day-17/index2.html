<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Timer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
        }

        .timer-box {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.1),
                inset 0 0 20px rgba(0, 255, 255, 0.05);
            width: 320px;
        }

        .time-input {
            width: 80%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            color: #00f2ff;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .time-input::placeholder {
            color: #7cdff0;
        }

        .circle {
            height: 230px;
            width: 230px;
            border-radius: 50%;
            border: 10px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            overflow: hidden;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.1), transparent 60%);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.2),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .circle::before {
            content: "";
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 12px solid #00f2ff;
            border-left-color: transparent;
            border-bottom-color: transparent;
            opacity: 0.3;
            transform: rotate(45deg);
        }

        .time {
            font-size: 2.7rem;
            font-weight: 700;
            color: #00f2ff;
            text-shadow: 0 0 12px #00f2ff;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        button {
            padding: 10px 25px;
            border: none;
            cursor: pointer;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.2s;
        }

        #start {
            background: #00eaff;
            color: #00141b;
        }

        #start:hover {
            box-shadow: 0 0 15px #00eaff;
        }

        #stop {
            background: #ff3b3b;
            color: white;
        }

        #stop:hover {
            box-shadow: 0 0 15px #ff3b3b;
        }

        #msg {
            margin-top: 12px;
            color: #ff5b5b;
            font-size: 16px;
            font-weight: 600;
            min-height: 25px;
        }
    </style>

</head>

<body>

    <div class="timer-box">
        <input type="text" class="time-input" id="userTime" placeholder="Enter time (sec)">

        <div class="circle">
            <div class="time" id="display">00:00</div>
        </div>

        <div class="buttons">
            <button id="start">Start</button>
            <button id="stop">Stop</button>
        </div>

        <div id="msg"></div>

    </div>

    <script>
        let timer;
        let remaining = 0;

        const input = document.getElementById("userTime");
        const display = document.getElementById("display");
        const msg = document.getElementById("msg");
        const startBtn = document.getElementById("start");
        const stopBtn = document.getElementById("stop");


        startBtn.addEventListener("click", () => {

            msg.textContent = "";

            let userValue = Number(input.value);


            remaining = userValue;
            showTime(remaining);
            clearInterval(timer);

            timer = setInterval(() => {
                remaining--;
                showTime(remaining);

                if (remaining <= 0) {
                    clearInterval(timer);
                    display.textContent = "00:00";
                    msg.textContent = "Time's up!!";
                }
            }, 1000);

        });

        stopBtn.addEventListener("click", () => {
            clearInterval(timer);
        });

        function showTime(sec) {
            let s = sec < 10 ? "0" + sec : sec;
            display.textContent = "00:" + s;
        }

    </script>

</body>

</html>
