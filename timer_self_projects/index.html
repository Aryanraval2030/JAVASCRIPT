<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        }

        .main-container {
            width: 320px;
            background: #111;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }

        .timer {
            font-size: 3rem;
            font-weight: 600;
            color: #00ffcc;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        input::placeholder {
            color: #888;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button.start {
            background: #00c853;
            color: #fff;
        }

        button.stop {
            background: #d50000;
            color: #fff;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }
        .err{
            position: fixed;
            top: 20px;
            color: white;
        }
    </style>
</head>

<body>
    <div class="err"></div>

    <div class="main-container">
        <div class="timer">00:00:00</div>
        <input type="text" id="inputuser" placeholder="Enter time start..">
        <button class="btn1">start</button>
        <button class="btn2">stop</button>
    </div>


    <script src="./timer.js"></script>
</body>

</html>
