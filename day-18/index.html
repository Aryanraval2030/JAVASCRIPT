<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #question-div {
            height: 20%;
            border: 2px solid black;
            margin: 5px;
            border-radius: 5px;
        }

        .options-otr {
            height: 50%;
            margin: 5px;
            border-radius: 5px;
        }

        .option-inr {
            height: 50%;
            width: 100%;
            border-radius: 5px;
            border: 2px solid black;
            cursor: pointer;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 5px;
        }

        .btn {
            border: 1px solid black;
            padding: 0 10px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .btns {
            height: 40px;
            width: 98%;
            display: flex;
            justify-content: space-between;
            margin: 0 10px;
        }
    </style>
</head>

<body class="text-center">

    <div class="fs-2">quiz of JavaScript</div>

    <div class="d-flex justify-content-center align-items-center" style="height: 90vh; width: 100vw;">
        <div class="card " style="width: 90vw; height: 80vh; border: none;">
            <div id="question-div"></div>

            <div class="options-otr d-grid" style="grid-template-columns: 1fr 1fr; gap:10px;">
                <div class="option-inr">A. first questions options .</div>
                <div class="option-inr">B. first questions options .</div>
                <div class="option-inr">C. first questions options .</div>
                <div class="option-inr">D. first questions options .</div>
            </div>
            <div class="btns">
                <button class="btn">prev</button>
                <button class="btn">next</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
