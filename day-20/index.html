<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Verification</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('https://images.stockcake.com/public/9/2/9/9291a9f0-04d5-48b6-81e7-bc1d6682b2a9_large/moonlit-butterfly-beauty-stockcake.jpg');
            background-position: center;
            background-size: cover;
        }

        .outer-form {
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            height: 400px;
            width: 350px;
            /* background: transparent; */
            background-color: rgba(189, 189, 189, 0.377);
            backdrop-filter: blur(10);
            margin: 50px auto;
            border-radius: 10px;
            padding: 20px;
        }

        #form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            font-weight: 500;
            color: rgb(0, 0, 0);
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            display: flex;
            justify-content: center;
        }

        p {
            font-size: 14px;
            color: red;
            height: 5px;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 10px 40px;
            border-radius: 20px;
            cursor: pointer;
            background: #000;
            color: #fff;
            font-weight: bold;
            border: none;
        }
    </style>

</head>

<body>

    <div class="outer-form">
        <form id="form">

            <label>
                username:
                <input type="text" id="userName" placeholder="Enter your username">
            </label>
            <p id="error1"></p>

            <label>
                email:
                <input type="email" class="email" placeholder="Enter your email">
            </label>
            <p id="error2"></p>

            <label>
                password:
                <input type="password" class="password" placeholder="Enter your password">
            </label>
            <p id="error3"></p>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>

        let userName = document.querySelector("#userName");
        let email = document.querySelector(".email");
        let password = document.querySelector(".password");
        let form = document.querySelector("#form");


        // errors
        let error1 = document.querySelector("#error1")
        let error2 = document.querySelector("#error2")
        let error3 = document.querySelector("#error3")

        function show1() {
            let error1 = document.querySelector("#error1");

            if (userName.value.trim() === "") {
                error1.innerHTML = "Please enter your username";
            } else {
                error1.innerHTML = "";
            }
        }

        function show2() {
            let error2 = document.querySelector("#error2");

            if (email.value.trim() === "") {
                error2.innerHTML = "Please enter your email";
            } else {
                error2.innerHTML = "";
            }
        }

        function show3() {
            let error3 = document.querySelector("#error3");

            if (password.value.trim() === "") {
                error3.innerHTML = "Please enter your password";
            } else {
                error3.innerHTML = "";
            }
        }

        // remove
        userName.addEventListener("input", () => {
            error1.innerHTML = "";
        })
        email.addEventListener("input", () => {
            error2.innerHTML = "";
        })
        password.addEventListener("input", () => {
            error3.innerHTML = "";
        })


        form.addEventListener("submit", (e) => {
            e.preventDefault();

            show1();
            show2();
            show3();
        });

    </script>

</body>

</html>
